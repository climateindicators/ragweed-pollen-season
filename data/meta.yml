indicator:
  name: Ragweed Pollen Season
  slug: ragweed-pollen-season
  publisher: U.S. Environmental Protection Agency
  source_page: https://19january2025snapshot.epa.gov/climate-indicators/climate-change-indicators-ragweed-pollen-season/index.html
  technical_documentation: https://19january2025snapshot.epa.gov/system/files/documents/2024-06/ragweed_documentation.pdf
  rights: Public domain, work of the U.S. Government (17 U.S.C. 105)
datasets:
- file: ragweed_pollen_season_change.csv
  figure: Figure 1
  figure_title: Figure 1. Change in Ragweed Pollen Season, 1995-2015
  source_file: ragweed_fig-1.csv
  source_sha256: 3941da5fe6c1b6207d7979a055496050c2bdbc2a2ccf68a713b82ba03f3b4e8e
  source_encoding: windows-1252
  data_source: Ziska et al., 2016
  web_update: August 2016
  unit: decimal degrees; days
  rows: 11
  columns:
  - name: city
    type: string
    description: Monitoring station city, verbatim from the source file. Several source
      entries carry a trailing comma or extra space baked into the city name (e.g.
      "Austin/Georgetown,"); this is preserved unmodified rather than corrected.
  - name: state_province
    type: string
    description: US state or Canadian province, verbatim from the source file. The
      two Canadian entries additionally carry ", Canada" inside this field (e.g. "MB,
      Canada").
  - name: latitude
    type: number
    description: Station latitude, decimal degrees, verbatim from the source file.
  - name: longitude
    type: number
    description: Station longitude, decimal degrees, verbatim from the source file.
  - name: change_days
    type: number
    description: Change in the length of ragweed pollen season from 1995 to 2015,
      in days, verbatim from the source file. Positive means the season grew longer;
      the single negative value (Austin/Georgetown) means it grew shorter.
  note: 'Every row is one of the 11 long-term pollen monitoring stations EPA''s analysis
    covers. There is no year dimension: this figure reports one already-computed 1995-to-2015
    change per station, not a time series.'
